<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Авторизация</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8, 8, 12, 0.95);
    font-family: Arial, sans-serif;
    color: white;
}

.auth {
    width: 420px;
    padding: 35px;
    background: #151515;
    border: 1px solid #d4af37;
    border-radius: 16px;
    box-shadow: 0 0 45px rgba(180, 0, 0, 0.35);
    text-align: center;
}

h1 {
    color: #d4af37;
    font-size: 28px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    background: #222;
    border: 1px solid #444;
    border-radius: 8px;
    color: white;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #d4af37;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    background: linear-gradient(90deg, #b8860b, #ffd700);
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.15);
}

.error {
    color: #ff5555;
    min-height: 20px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="auth">
    <h1>ДОБРО ПОЖАЛОВАТЬ</h1>
    <p class="subtitle">Авторизация игрового аккаунта</p>

    <form id="loginForm">
        <input
            id="username"
            type="text"
            placeholder="Игровой ник"
            autocomplete="username"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
            autocomplete="current-password"
            required
        >

        <p class="error" id="error"></p>

        <button type="submit">ВОЙТИ В ИГРУ</button>
    </form>
</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("error").textContent =
        "Подключение к серверу авторизации ещё не настроено.";
});
</script>

</body>
</html>
