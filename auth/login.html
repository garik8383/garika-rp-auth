<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garika RP — Вход</title><link rel="stylesheet" href="style.css"></head><body><main class="box"><div class="crown">♛</div><div class="brand">GARIKA <b>RP</b></div><div class="intro">Добро пожаловать на наш проект!</div><div class="sub">Присоединяйся к жизни штата, создавай свою историю,<br>строй карьеру, развивайся и достигай большего!</div><nav class="tabs"><a href="login.html" class="active">Вход</a><a href="register.html" class=" ">Регистрация</a></nav><form id="form"><input class="field" id="pass" type="password" placeholder="Пароль" minlength="8" maxlength="64" required><div class="row"><label><input type="checkbox" id="remember" checked> Запомнить меня</label><span>Добро пожаловать!</span></div><div id="err"></div><button type="submit">ВОЙТИ В ИГРУ →</button></form><div class="foot">Garika RP © 2026</div></main><script>const f=document.getElementById('form'),err=document.getElementById('err');f.addEventListener('submit',function(e){e.preventDefault();const p=document.getElementById('pass').value;if(!/^[!-~]{8,64}$/.test(p)){err.textContent='Пароль должен содержать 8–64 символа без пробелов';return;}const data='L '+p;if(typeof cef==='undefined'||typeof cef.emit!=='function'){err.textContent='CEF не подключён';return;}cef.emit('auth:submit',data);err.textContent='Проверяем данные…';});</script></body></html>
