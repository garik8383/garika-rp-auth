<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garika RP — Регистрация</title><link rel="stylesheet" href="style.css"></head><body><main class="box"><div class="crown">♛</div><div class="brand">GARIKA <b>RP</b></div><div class="intro">Добро пожаловать на наш проект!</div><div class="sub">Присоединяйся к жизни штата, создавай свою историю,<br>строй карьеру, развивайся и достигай большего!</div><nav class="tabs"><a href="login.html" class=" ">Вход</a><a href="register.html" class="active">Регистрация</a></nav><form id="form"><input class="field" id="email" type="email" placeholder="Электронная почта" maxlength="96" required><input class="field" id="pass" type="password" placeholder="Пароль" minlength="8" maxlength="64" required><input class="field" id="confirm" type="password" placeholder="Повторите пароль" minlength="8" maxlength="64" required><div id="err"></div><button type="submit">СОЗДАТЬ АККАУНТ →</button></form><div class="foot">Garika RP © 2026</div></main><script>const f=document.getElementById('form'),err=document.getElementById('err');f.addEventListener('submit',function(e){e.preventDefault();const p=document.getElementById('pass').value;if(!/^[!-~]{8,64}$/.test(p)){err.textContent='Пароль должен содержать 8–64 символа без пробелов';return;}const email=document.getElementById('email').value.trim();if(!email||/\s/.test(email)||!email.includes('@')){err.textContent='Введите корректную почту';return;}if(p!==document.getElementById('confirm').value){err.textContent='Пароли не совпадают';return;}const data='R '+email+' '+p;if(typeof cef==='undefined'||typeof cef.emit!=='function'){err.textContent='CEF не подключён';return;}cef.emit('auth:submit',data);err.textContent='Проверяем данные…';});</script></body></html>
